
name: Verify Changelog

on:
  workflow_dispatch:

jobs:
  verify-changelog:
    name: Verify Changelog Entry
    runs-on: ubuntu-latest
    # Removed invalid needs dependency
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get PR info
        id: pr
        run: |
          echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
      - name: Check for changelog entry
        id: check_changelog
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          CHANGELOG_FILE=".changelog/pr-${PR_NUMBER}.txt"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "Changelog file $CHANGELOG_FILE exists"
            echo "exists=true" >> $GITHUB_OUTPUT
            
            # Extract description from the new format
            DESCRIPTION=$(grep "^description:" "$CHANGELOG_FILE" | sed 's/^description:[[:space:]]*//')
            
            # Validate required fields
            TYPE=$(grep "^type:" "$CHANGELOG_FILE" | sed 's/^type:[[:space:]]*//')
            TICKET=$(grep "^ticket:" "$CHANGELOG_FILE" | sed 's/^ticket:[[:space:]]*//')
            
            if [ -z "$TYPE" ] || [ -z "$DESCRIPTION" ] || [ -z "$TICKET" ]; then
              echo "::error::Changelog file is missing required fields (type, description, or ticket)."
              exit 1
            fi
            
            echo "Changelog entry is valid."
          else
            echo "::error::Changelog file $CHANGELOG_FILE does not exist. Please add a changelog entry for this PR."
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "description_too_long=false" >> $GITHUB_OUTPUT
            exit 1
